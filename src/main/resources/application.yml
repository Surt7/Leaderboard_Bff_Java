server:
  port: ${PORT:8085}
  forward-headers-strategy: framework
  max-http-request-header-size: 64KB

spring:
  application:
    name: leaderboard-bff
  threads:
    virtual:
      enabled: true

  # ===================================================================
  # SPRING CLOUD GATEWAY CONFIGURATION
  # ===================================================================
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Headers Access-Control-Allow-Methods Vary, RETAIN_FIRST
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s
      routes:
        # Downstream Core API Route with Token Relay
        - id: core-api-route
          uri: ${CORE_API_URL:http://localhost:7085}
          predicates:
            - Path=/api/**
          filters:
            - TokenRelay=
        # Downstream GraphQL Route with Token Relay
        - id: graphql-route
          uri: ${CORE_API_URL:http://localhost:7085}
          predicates:
            - Path=/graphql
          filters:
            - TokenRelay=

  # ===================================================================
  # REDIS (Reactive Distributed Session Cache)
  # ===================================================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms

  # ===================================================================
  # OAUTH2 / OIDC CLIENT CONFIGURATION (Keycloak / IdP)
  # ===================================================================
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${OAUTH2_CLIENT_ID:worldpinball-bff}
            client-secret: ${OAUTH2_CLIENT_SECRET:bff-secret}
            scope: openid,profile,roles
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8082/realms/worldpinball}
            user-name-attribute: preferred_username

# ===================================================================
# gRPC CLIENT CONFIGURATION (Core API connection)
# ===================================================================
grpc:
  client:
    gameSessionService:
      address: ${GRPC_CORE_API_ADDRESS:static://localhost:9090}
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-without-calls: true
      keep-alive-time: 60s
      keep-alive-timeout: 20s

# ===================================================================
# ACTUATOR & PROMETHEUS METRICS & OPENTELEMETRY TRACING
# ===================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORTER_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}

# ===================================================================
# LOGGING
# ===================================================================
logging:
  level:
    root: INFO
    com.worldpinball.bff: DEBUG
    org.springframework.cloud.gateway: INFO
